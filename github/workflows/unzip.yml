name: Zip'i aç
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
      - name: Zip'i aç ve depoya yükle
        run: |
          unzip -o wsb-hamburg-mescid-tv-github.zip -x ".github/*" -d .
          rm wsb-hamburg-mescid-tv-github.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Proje dosyaları açıldı"
          git push
